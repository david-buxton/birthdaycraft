<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>BirthdayCraft</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game"></div>

  <div id="hud">
    <div id="title">BirthdayCraft</div>
    <div id="quest">Collect <span id="diamonds">0</span>/5 diamonds</div>
    <div id="hint">Desktop: WASD + mouse drag. iPad: left stick moves, right side looks. Tap blocks to mine/place.</div>
  </div>

  <div id="message" class="hidden">
    <h1>🎂 Happy Birthday! 🎂</h1>
    <p>You found all the diamonds. This world was built just for you.</p>
    <button id="again">Play again</button>
  </div>

  <div id="leftStick" class="stick"><div></div></div>
  <div id="actions">
    <button id="placeBtn">Place</button>
    <button id="mineBtn">Mine</button>
    <button id="jumpBtn">Jump</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.164.1/build/three.module.js"
      }
    }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
